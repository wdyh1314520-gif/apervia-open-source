name: 缺陷报告
description: 报告可以稳定复现的 Apervia 问题
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先移除 Token、邮箱、用户数据和其他敏感信息。安全漏洞不要在此公开，请阅读 SECURITY.md。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 填写镜像标签和健康接口中的提交 SHA。
      placeholder: "1.0.0 / sha-..."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - App / 登录与账号
        - Chat Completions
        - Responses
        - 文件与知识库
        - MCP
        - Sandbox Runner
        - Docker / 部署
        - 管理后台
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 提供最小、连续、可重复的步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与已脱敏日志
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认这不是需要私密报告的安全漏洞。
          required: true
        - label: 我已移除凭据、个人信息和用户数据。
          required: true
